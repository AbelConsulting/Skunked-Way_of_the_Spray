name: Playwright integration tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-optional

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        run: |
          # Use the locally-installed playwright package so `require('playwright')` works
          npx playwright install --with-deps

      - name: Run Playwright integration scripts
        run: |
          chmod +x ./scripts/run_with_static_server.sh
          ./scripts/run_with_static_server.sh \
            "node tools/touch_controls_landscape_test.js" \
            "node tools/touch_controls_immediate_test.js" \
            "node tools/touch_controls_concurrent_requests_test.js" \
            "node tools/touch_controls_overlapping_forces_test.js" \
            "node tools/touch_controls_present_on_start_test.js" \
            "node tools/integration_pending_start_slow_load.js" \
            "node tools/second_sprites_presence_test.js"
