name: Firebase Deploy

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Playwright tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start static server
        run: |
          nohup python3 -m http.server 8000 &
          for i in 1 2 3 4 5; do
            if curl -sSf http://localhost:8000/ >/dev/null; then
              echo "Server is up"; break
            fi
            sleep 1
          done

      - name: Run enemy missing-level telemetry test
        run: node tools/run_enemy_missing_level_sim.js

  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: cd functions && npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting + Functions
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: wots-52349111-5060d
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project wots-52349111-5060d
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
