name: Sprite Padding Smoke Test

on:
  push:
    paths:
      - '.github/workflows/sprite-padding.yml'
      - 'js/**'
      - 'tools/**'
  pull_request:
    paths:
      - '.github/workflows/sprite-padding.yml'
      - 'js/**'
      - 'tools/**'

jobs:
  sprite-padding:
    name: Sprite padding detection
    # Keep the runner on an OS supported by the installed Playwright browsers.
    runs-on: ubuntu-24.04
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --omit=optional --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: |
          for attempt in 1 2 3; do
            if npx playwright install chromium; then
              exit 0
            fi
            echo "Playwright install failed (attempt ${attempt}/3)."
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 5
          done

      - name: Run sprite padding smoke test
        run: |
          node tools/check_sprite_padding.js
